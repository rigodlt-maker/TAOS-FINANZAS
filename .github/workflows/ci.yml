# Revisión automática en cada cambio: pruebas, tipos, compilación y vulnerabilidades conocidas.
# Solo corre en el repositorio original de TAOS, no en las copias de los compradores.
name: Revisión

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    if: github.repository_owner == 'rigodlt-maker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
