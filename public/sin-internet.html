<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Sin internet · Finanzas</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0a0a; color: #f5f5f5; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 48px 16px; display: grid; gap: 16px; }
  .tarjeta { background: #151515; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #a3a3a3; }
  input { min-height: 48px; border-radius: 12px; border: 1px solid #333; background: #0a0a0a; color: #f5f5f5; padding: 0 14px; font-size: 16px; }
  button { min-height: 48px; border: 0; border-radius: 12px; background: #d4af37; color: #0a0a0a; font-weight: 600; font-size: 16px; }
  button.secundario { background: transparent; color: #d4af37; border: 1px solid #d4af37; }
  #ok { color: #d4af37; }
</style>
</head>
<body>
<main>
  <h1>Sin internet</h1>
  <p>Por seguridad, tus saldos y movimientos no se guardan en el celular: los verás cuando vuelva la señal.</p>
  <form class="tarjeta" id="f">
    <label for="frase"><strong>¿Gastaste algo? Anótalo aquí</strong></label>
    <input id="frase" name="frase" required maxlength="200" autocomplete="off" placeholder="Café 45 efectivo">
    <button type="submit">Guardar para mandarlo después</button>
    <p id="ok" hidden>Guardado en este celular. Se manda solo cuando vuelva la señal y abras la app.</p>
  </form>
  <p class="tarjeta" id="sin-sesion" hidden>Para anotar gastos sin internet, primero entra a tu app con señal.</p>
  <button class="secundario" type="button" onclick="location.reload()">Intentar de nuevo</button>
</main>
<script>
  // Misma cola que usa la app (lib/cola.ts), con dueño: la sesión abierta en este celular (S15-R6).
  // Sin sesión (se cerró) no se guarda nada: se pide entrar con señal.
  var dueno = null;
  try { dueno = localStorage.getItem("taos-cola-dueno"); } catch (err) {}
  if (!dueno || !/^[\w-]{1,64}$/.test(dueno)) {
    dueno = null;
    document.getElementById("f").hidden = true;
    document.getElementById("sin-sesion").hidden = false;
  }
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var frase = document.getElementById("frase").value.trim();
    if (!frase || !dueno) return;
    try {
      var clave = "taos-cola-sin-internet:" + dueno;
      var cola = JSON.parse(localStorage.getItem(clave) || "[]");
      if (!Array.isArray(cola)) cola = [];
      cola.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), tipo: "frase", frase: frase, creado: new Date().toISOString(), dueno: dueno });
      localStorage.setItem(clave, JSON.stringify(cola));
      document.getElementById("frase").value = "";
      document.getElementById("ok").hidden = false;
    } catch (err) {}
  });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
